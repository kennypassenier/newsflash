# newsflash configuration — copy to ~/.config/newsflash/config.toml
# The token is NOT configured here (AR10): it arrives as KYU_TOKEN
# via `latch run` (see the systemd unit), or via token_file below.

# The kyu hub. Live hub: "http://10.10.10.9:8080" — during
# development always a scratch hub (SCOPE S11c).
hub_url = "http://127.0.0.1:8080"

# Defaults shown; omit any line to keep the default.
#topic = "notify.kenny"
#subscription = "desktop"

# Toast language: "nl" (default) or "en". A missing translation falls
# back to the other language rather than dropping the toast (M3).
#language = "nl"

# Subscription TTL (SCOPE S4): after this long, an undelivered message
# expires at the hub — recorded, never silent. Default 10.
#ttl_minutes = 10

# Optional chime, played after each toast (K6). House style:
# cyberpunk-soft, never metallic. Omit for silence.
# Kenny's pick (2026-09-26): assets/chimes/newsflash-soft-pulse.wav
#sound_file = "/home/kenny/.local/share/newsflash/chimes/newsflash-soft-pulse.wav"

# M10: how much longer (ms) the interactive-toast watcher waits above a
# bounded toast's own expiry before giving up as a safety backstop —
# not a UX duration. Does not apply to critical (persists until
# dismissed, no cap regardless of this value). Default 30000 (30s).
#interactive_wait_margin_ms = 30000

# Fallback token source when KYU_TOKEN is not set: a file holding
# the app token from the hub's /apps page. Must be chmod 600.
#token_file = "/home/kenny/.config/newsflash/token"

# How long a notification may exist, in minutes (both desktops). A
# message marked `ephemeral` by the sender (e.g. the "Beweging" door
# reminders) disappears this long after it was sent — from the screen and
# from the notification history. Default 10.
#ephemeral_minutes = 10
# Per priority, for every other message. Omit = keep them (Windows: up
# to 3 days in Notification Center; Plasma: until you clear history).
#expire_info_minutes = 60
#expire_warning_minutes = 240
#expire_critical_minutes = 1440

# How long a popup stays on screen before it moves to the history
# (seconds, 1 to 3600). Critical popups always stay until answered.
# Windows only knows short (~7 s) and long (~25 s): 16 s or more
# means long there.
#popup_info_seconds = 10
#popup_warning_seconds = 30

# Where path-only links from pipeline-v2 point (click_url
# "/control-panel/homelab" → Home Assistant). Omit = such links are
# not offered; full http(s) links always work.
#link_base_url = "http://10.10.10.2:8123"

# How long Snooze hides a notification before it shows again (minutes,
# 1 to 1440).
#snooze_minutes = 15
