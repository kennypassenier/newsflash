# desk-courier configuration — copy to ~/.config/desk-courier/config.toml
# The token is NOT configured here (AR10): it arrives as MAILBOX_TOKEN
# via `latch run` (see the systemd unit), or via token_file below.

# The mailbox hub. Live hub: "http://10.10.10.9:8080" — during
# development always a scratch hub (SCOPE S11c).
hub_url = "http://127.0.0.1:8080"

# Defaults shown; omit any line to keep the default.
#topic = "notify.kenny"
#subscription = "desktop"

# Toast language: "nl" (default) or "en". A missing translation falls
# back to the other language rather than dropping the toast (M3).
#language = "nl"

# Subscription TTL (SCOPE S4): after this long, an undelivered message
# expires at the hub — recorded, never silent. Default 10.
#ttl_minutes = 10

# Optional chime, played after each toast (K6). House style:
# cyberpunk-soft, never metallic. Omit for silence.
#sound_file = "/home/kenny/Music/chimes/soft-ping.ogg"

# Fallback token source when MAILBOX_TOKEN is not set: a file holding
# the app token from the hub's /apps page. Must be chmod 600.
#token_file = "/home/kenny/.config/desk-courier/token"
